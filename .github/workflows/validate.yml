name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run tests
        run: pytest -q
      - name: Compile integration
        run: python -m compileall -q custom_components
      - name: Check public tree for secrets and local identifiers
        run: |
          ! grep -RInE '(gho_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{20,}|ya29\.[0-9A-Za-z_-]{20,}|xperia|pve|10\.0\.0\.|FF:[0-9A-Fa-f]{2})' \
            --exclude-dir=.git --exclude-dir=.github .
